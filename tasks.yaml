# English Grade 3-4 outcomes. Chosen after coverage was confirmed (Doc 3). Codes reused for different text in the source were avoided.
# Science topics were re-worded on 2 Nov to match these outcomes; the group should review them (DEC 016).
# (Earlier drafts had outcome_id: null because no English source had been found; that claim was wrong.)
# Review checklist: topic suits the grade? outcome ID matches the topic? context realistic for UAE classes?
